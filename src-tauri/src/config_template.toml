# ============================================================
#  闪念 配置文件
# ============================================================
#
#  · 保存后立即生效，无需重启（包括全局快捷键与窗口尺寸）
#  · 配置有误时，闪念将沿用上次有效的设置，并在窗口中提示错误位置
#  · 删除某一项即恢复其默认值；删除本文件后，闪念将重新生成默认配置
#  · 开关项填写 true 或 false；文本需加引号；# 之后的内容为注释
#  · Windows 路径建议使用单引号，反斜杠无需转义，例如 'D:\Documents'
#
#  在闪念中输入 /config 可随时打开本文件。


# ------------------------------------------------------------
# 常规
# ------------------------------------------------------------
[general]

# 唤起或隐藏窗口的全局快捷键。
# 格式为「修饰键+主键」，例如 "Alt+Space"、"Ctrl+Shift+Space"、"Ctrl+Alt+K"。
# 修饰键：Ctrl、Alt、Shift、Win；主键：字母、数字、Space、F1–F12 等。
# 快捷键被其他程序占用时，将保留原快捷键并给出提示。
hotkey = "Alt+Space"

# 开机时自动启动。
autostart = false

# 执行 /config 时用于打开配置文件的程序，可填写程序名（如 "notepad"、"code"）或完整路径。
editor = "notepad"


# ------------------------------------------------------------
# AI 对话
# ------------------------------------------------------------
[ai]

# DeepSeek API Key（以 sk- 开头），也可在设置面板中填写。
# 本文件以明文保存，请勿外传。
api_key = ""

# 接口地址与模型名称，通常无需修改。
base_url = "https://api.deepseek.com"
model = "deepseek-flash"

# 深度思考：先推理后作答，准确度更高，响应更慢。可在设置面板中切换。
deep_thinking = false

# 联网搜索：作答前检索网络信息。可在设置面板中切换。
web_search = false

# 通过系统代理访问 AI 接口。默认直连；DeepSeek 为国内服务，使用代理可能导致连接失败。
use_system_proxy = false

# 每次提问携带的历史消息条数。条数越多，上下文越完整，响应越慢，费用越高。
context_messages = 20

# 连接超时时间（秒）。
connect_timeout_secs = 10

# 当前使用的系统提示词编号（系统提示词用于设定回答风格）。
# 0 为不使用，1 为默认，其余编号见 prompts.toml。可通过 /spt 编号 切换，/spt edit 编辑。
prompt = 1


# ------------------------------------------------------------
# 联网搜索
# ------------------------------------------------------------
[search]

# 单次回答的最大 token 数。
max_tokens = 8192

# 单次回答的最大搜索次数。
max_searches = 5

# 同时启用深度思考时，思考过程的 token 上限，须小于 max_tokens。
thinking_budget = 4096


# ------------------------------------------------------------
# 记录
# ------------------------------------------------------------
[history]

# 对话记录的本地保留天数，过期后自动删除。
retention_days = 30

# 输入历史的保留条数（通过 ↑ ↓ 浏览），0 为不记录。
input_history = 100


# ------------------------------------------------------------
# 选中文字填入
# 唤起窗口时，将其他程序中选中的文字自动填入输入框
# ------------------------------------------------------------
[selection]

# 是否启用。
enabled = true

# 等待目标程序完成复制的最长时间（毫秒）。未选中文字时，窗口将延迟相应时间显示。
# 在 WPS、Word 等程序中无法获取选中文字时，可适当调大，例如 300。
wait_ms = 200


# ------------------------------------------------------------
# 窗口
# 尺寸单位为像素，不含窗口四周的透明边距
# ------------------------------------------------------------
[window]

# 搜索框状态下的窗口宽度。
width = 640

# 搜索框状态下的最大高度，超出部分在窗口内滚动。
max_height = 460

# 展开历史对话（Ctrl+E）时的窗口宽度与高度。
expanded_width = 860
expanded_height = 620

# 输入框为空时显示的提示文字。节日主题启用时由主题替换。
placeholder = "For you, always."


# ------------------------------------------------------------
# 更新
# ------------------------------------------------------------
[update]

# 在后台自动检查新版本。发现新版本时，输入框下方显示提示，可通过 /update 查看并安装。
auto_check = true

# 自动检查新版本与在线主题的间隔（小时）。
check_interval_hours = 6


# ------------------------------------------------------------
# 主题
# ------------------------------------------------------------
[theme]

# 主题模式："auto" 按日期自动启用节日主题；"off" 关闭主题；
# 也可填写主题 ID（如 "national-day"）以始终使用该主题。/theme 命令会修改此项。
mode = "auto"

# 在线主题：在后台同步发布者推送的节日主题，提前下载至本地，生效当日无需联网。
# 主题经签名校验，仅包含配色与图片。可通过 /theme sync 立即同步。
online = true


# ------------------------------------------------------------
# 别名
# 格式：别名 = '路径、网址或程序'，供 /o 使用，不区分大小写。
# 通过 /rmbr 添加的别名将自动写入此处，也可手动添加。
# 别名包含中文、空格等字符时需加双引号，例如：
#   "文档" = 'D:\Documents'
#   wx = 'C:\Program Files\Tencent\WeChat\WeChat.exe'
# ------------------------------------------------------------
[aliases]


# ------------------------------------------------------------
# 内置别名
# ------------------------------------------------------------
[builtin_aliases]

# 已停用的内置别名。通过 /rmbr -d 停用内置别名时将写入此处，例如 disabled = ["ps", "gg"]
disabled = []
