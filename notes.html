<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闪念 · 便签</title><link rel="stylesheet" href="/src/notes.css"></head><body data-edge="right">
<div id="anchor"><button id="bubble" aria-label="展开便签，按住可拖动" aria-expanded="false" title="点击展开 · 按住拖动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12a2 2 0 0 1 2 2V15l-5 5H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z"/><path d="M15 20v-4a1 1 0 0 1 1-1h4M8 8h8M8 12h5"/></svg><span id="badge" hidden></span></button></div>
<div id="surface" hidden><main id="paper" aria-label="便签" inert><div id="paper-content">
<header><div id="note-heading"><span id="note-title">随手记</span><time id="today-date"></time></div><button id="close" class="icon-button" aria-label="收起便签" title="收起（Esc）"><svg viewBox="0 0 24 24"><path d="m8 6 6 6-6 6"/></svg></button><button id="pin" class="icon-button" aria-label="固定便签，关闭自动收起" aria-pressed="false" title="固定便签"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 8 0-1 6 3 4v2H6v-2l3-4-1-6ZM12 15v6"/></svg></button><button id="exit" class="icon-button" aria-label="退出便签" title="退出，保留内容"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button></header>
<nav id="agenda-views" aria-label="日程范围"><button data-view="today" aria-pressed="true">今天</button><button data-view="upcoming" aria-pressed="false">以后</button><button data-view="all" aria-pressed="false">全部</button></nav>
<div id="list" role="list" aria-label="待办列表"></div><p id="empty">把想做的事，先记在这里。<small>在搜索框输入 @note 记下待办</small></p>
<div id="undo-bar" hidden><span>已移入最近删除</span><button id="undo">撤销</button></div>
<footer><span id="count"></span><button id="trash-toggle">最近删除</button></footer><p id="error" role="alert"></p>
<section id="trash-panel" hidden aria-label="最近删除"><div class="panel-heading"><span>最近删除</span><button id="trash-close" class="icon-button" aria-label="返回待办">×</button></div><div id="trash-list"></div><p id="trash-empty">没有已删除的待办</p></section>
<section id="date-editor" hidden aria-label="安排日期"><label for="note-date">安排到哪一天</label><div id="quick-dates" aria-label="快捷安排日期"></div><input id="note-date" type="date" min="0001-01-01" max="9999-12-31"><div><button id="date-clear">不安排日期</button><button id="date-save">保存</button><button id="date-cancel" aria-label="取消日期编辑">取消</button></div><small>仅安排日期，不设置闹钟或通知</small></section>
</div></main></div><script type="module" src="/src/notes.js"></script></body></html>
