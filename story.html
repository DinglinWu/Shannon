<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>故事舞台 · 闪念</title><link rel="icon" type="image/png" href="/story-icon.png"><link rel="stylesheet" href="/src/story.css"></head><body><header><div class="brand"><img src="/story-icon.png" class="story-brand-icon" alt=""><span>STORY / 闪念</span><h1>故事舞台</h1></div><select id="stories" aria-label="选择故事"></select><button id="new">新的故事</button><button id="settings" class="quiet">故事设定</button><button id="delete-story" class="quiet">删除故事</button><button id="story-trash" class="quiet">最近删除</button></header><main><aside><p class="eyebrow">CHARACTERS / 人物</p><div id="cast"></div></aside><section class="stage"><div class="scene"><p class="eyebrow">CURRENT SCENE / 当前场景</p><p id="scene">从一段故事开始。</p></div><div id="turns" tabindex="0" aria-label="故事叙事"></div><form id="play"><label for="input">你的行动，或希望发生的事</label><textarea id="input" rows="2" maxlength="4000" placeholder="写下你说的话、做的动作，或让角色自行行动……"></textarea><div class="play-actions"><span id="status" role="status"></span><div class="history-actions"><button type="button" id="undo" class="quiet">撤回上一轮</button><button type="button" id="redo" class="quiet">恢复撤回</button></div><button id="advance">继续演绎 <span>↗</span></button></div></form></section><aside class="records"><nav><button data-tab="events" aria-pressed="true">事件</button><button data-tab="characters" aria-pressed="false">人物变化</button><button data-tab="memory" aria-pressed="false">记忆</button><button data-tab="tools" aria-pressed="false">角色微信</button></nav><div id="records"></div></aside></main><dialog id="setup"><form id="setup-form"><div class="setup-title"><h2>故事设定</h2><button type="button" id="cancel" class="quiet">取消</button></div><label>故事名称<input id="title" maxlength="100" required></label><label>你主控的角色姓名<input id="player" maxlength="40" required placeholder="例如：林夏"></label><label>世界与故事边界<textarea id="world" maxlength="12000" placeholder="故事发生的背景，以及哪些事情不能被改写"></textarea></label><label>开场 / 当前场景<textarea id="setup-scene" maxlength="4000" placeholder="时间、地点，以及此刻正在发生的事"></textarea></label><div class="cast-toolbar"><h3>人物</h3><select id="import-role" aria-label="从微信导入人物"><option value="">从已有微信人物导入</option></select><button id="add-role" type="button" class="quiet">＋ 新人物</button></div><p class="hint">人物可随故事登场、离场和回归；退场保留档案及通信历史。心理活动是人物的内心描写，不是其他角色自动知道的信息。微信人物导入只复制资料，不带入旧私聊。</p><div id="setup-cast"></div><p id="setup-status" role="status"></p><button id="save">保存并进入舞台</button></form></dialog><dialog id="rewrite"><form id="rewrite-form"><div class="setup-title"><h2>编辑上一轮</h2><button type="button" id="rewrite-cancel" class="quiet">取消</button></div><p class="hint">重新演绎会先撤回上一轮，同时回退人物、记忆和角色消息；新一轮成功前仍可恢复原结果。</p><label for="rewrite-input">修改你的行动或剧情要求</label><textarea id="rewrite-input" maxlength="4000" rows="7" required></textarea><p id="rewrite-status" role="status"></p><button id="rewrite-submit">重新演绎</button></form></dialog><dialog id="delete-story-dialog"><form id="delete-story-form"><h2>删除故事？</h2><p id="delete-story-description"></p><p class="hint">故事及其人物、记忆、全部剧情和角色消息会一起移入“最近删除”，之后可以恢复。</p><p id="delete-story-status" role="status"></p><div class="library-actions"><button type="button" id="delete-story-cancel" class="quiet">取消</button><button id="delete-story-confirm" class="danger">移入最近删除</button></div></form></dialog><dialog id="story-trash-dialog"><div class="setup-title"><h2>最近删除</h2><button type="button" id="story-trash-close" class="quiet">关闭</button></div><p class="hint">恢复时会保留人物、记忆、剧情与角色消息。</p><div id="story-trash-list"></div><p id="story-trash-status" role="status"></p></dialog><script type="module" src="/src/story.js"></script></body></html>
