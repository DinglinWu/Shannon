<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广播站 · 闪念</title><link rel="stylesheet" href="/src/broadcast.css"></head><body><main><header><div class="station-symbol"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="3"/><path d="M10 10a8.5 8.5 0 0 0 0 12m12-12a8.5 8.5 0 0 1 0 12M6 6a14 14 0 0 0 0 20M26 6a14 14 0 0 1 0 20"/></svg></div><div><small>SHANNON · LOCAL RADIO</small><h1>广播站</h1></div><span id="sharing-badge">尚未共享</span></header><section class="sharing"><div class="section-heading"><h2>让消息走到别人面前</h2><button id="share-toggle">开启局域网共享</button></div><div class="ip-row"><label for="local-ip">本机局域网地址</label><input id="local-ip" placeholder="例如 192.168.1.8" autocomplete="off" spellcheck="false"></div><div id="share-details" hidden><label for="share-link">同一网络的人用浏览器打开此链接</label><div class="link-row"><input id="share-link" readonly aria-label="访问链接"><button id="copy-link">复制链接</button></div><p>访问码：<code id="access-code"></code></p></div><p class="hint">共享默认关闭。关闭此窗口会停止共享；已发布内容保留。网页仅能查看广播。</p></section><section class="editor"><h2>一条新的广播</h2><form id="draft-form"><label for="title">标题</label><input id="title" required maxlength="100" placeholder="用一句话说清这条消息"><label for="content">正文</label><textarea id="content" required maxlength="6000" placeholder="写下想让大家看到的内容…"></textarea><div class="editor-bottom"><label class="inline" for="minutes">有效期<select id="minutes"><option value="60">1小时</option><option value="1440" selected>1天</option><option value="10080">7天</option></select></label><label class="inline"><input id="pinned" type="checkbox">置顶</label><button id="prepare" class="primary">预览并发布</button></div></form></section><p id="status" role="status"></p><section class="history"><div class="section-heading"><h2>广播记录</h2><span id="post-count"></span></div><div id="posts"></div></section><footer>连接不上时，请确认双方处于同一网络，且系统防火墙允许闪念在专用网络通信。</footer></main><dialog id="review"><small>发布前，最后看一眼</small><h2 id="review-action">确认发布</h2><h3 id="review-title"></h3><p id="review-content"></p><p id="review-meta" class="hint"></p><p id="review-status" role="status"></p><div class="dialog-actions"><button id="review-cancel">取消</button><button id="review-confirm" class="primary">确认发布</button></div></dialog><dialog id="share-review"><h2>开启局域网共享</h2><p id="share-scope"></p><p class="hint">同网络持访问码的人可以查看广播板。使用HTTP连接，内容未经传输加密；不共享聊天、便签和其他文件。</p><div class="dialog-actions"><button id="share-cancel">取消</button><button id="share-confirm" class="primary">开启共享</button></div></dialog><script type="module" src="/src/broadcast.js"></script></body></html>
