<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闪念 · 插件管理</title><link rel="stylesheet" href="/src/plugin-manager.css"></head><body><main><header><div><p class="eyebrow">YOUR TOOLBOX / 闪念</p><h1>插件管理</h1><p id="summary">整理你的工具，让需要的功能留在手边。</p></div><button id="add-plugin">＋ 添加插件</button></header><section class="toolbar"><input id="search" type="search" placeholder="搜索名称、功能或插件 ID" aria-label="搜索插件"><nav aria-label="插件分类"><button data-filter="installed" aria-pressed="true">已添加</button><button data-filter="builtin" aria-pressed="false">官方</button><button data-filter="thirdparty" aria-pressed="false">第三方</button><button data-filter="available" aria-pressed="false">可添加</button></nav></section><p id="manager-status" role="status"></p><div id="plugin-list"></div><p class="footnote">主安装包不包含官方插件实现；添加时从 Gitee 下载，移除后保留数据。第三方插件安装、启停与卸载均需确认；管理界面始终可从设置、托盘或 /plugin 打开。</p></main><dialog id="add-dialog"><form id="install-form"><div class="dialog-heading"><h2>添加插件</h2><button type="button" id="close-add" class="quiet">关闭</button></div><h3>添加官方插件</h3><label for="official-source">本地官方插件包（可选）</label><input id="official-source" maxlength="2048" placeholder="填写 official-runtime ZIP 的完整路径；留空从 Gitee 下载"><p class="hint">Gitee 尚未发布时，填写本地包路径，再点击下面需要的插件旁的“添加”。一个共享包可用于全部官方插件。</p><div id="available-builtins"></div><hr><h3>安装第三方插件</h3><label for="install-source">插件 ZIP 的完整路径或 HTTPS 下载地址</label><input id="install-source" maxlength="2048" required placeholder="例如 E:\插件\example.zip"><p class="hint">读取后会单独展示来源、权限与校验信息，确认前不会安装。</p><p id="install-status" role="status"></p><button id="install-button">读取并查看安装信息</button></form></dialog><script type="module" src="/src/plugin-manager.js"></script></body></html>
